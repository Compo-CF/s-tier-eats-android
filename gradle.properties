org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.7.3 predates API 36; we compile against 36 to meet Play's Aug-31-2026
# target-API requirement. No API-36-specific APIs are used, so silence the
# "compiling against an unsupported/untested SDK" warning.
android.suppressUnsupportedCompileSdk=36
